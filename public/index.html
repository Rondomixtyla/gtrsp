<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTRSP IO</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #8cc34a;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Arayüz Elemanları (Canvas'ın üstünde durması için z-index: 10) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Sağ Üst Skor Tablosu */
        #leaderboard {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 160px;
            text-align: left;
        }

        /* Alt Yaş ve İtem Barı */
        #ui-bottom {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #age-text {
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }

        #health-bar-container {
            width: 220px;
            height: 14px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid rgba(0, 0, 0, 0.2);
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #55a630;
        }

        #item-bar {
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }

        .item-slot {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .item-slot.active {
            border-color: #ffd166;
        }

        /* Sol Alt Mini Harita Grid */
        #minimap {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 110px;
            height: 110px;
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .grid-cell {
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Oyun Çizim Ekranı -->
    <canvas id="gameCanvas"></canvas>

    <!-- Sploop.io Tarzı Arayüz -->
    <div id="ui-layer">
        <div id="leaderboard">
            <b>Skor Tablosu</b>
            <div id="leaderboard-list"></div>
        </div>

        <div id="minimap">
            <div class="grid-cell">A1</div><div class="grid-cell">A2</div><div class="grid-cell">A3</div><div class="grid-cell">A4</div>
            <div class="grid-cell">B1</div><div class="grid-cell">B2</div><div class="grid-cell">B3</div><div class="grid-cell">B4</div>
            <div class="grid-cell">C1</div><div class="grid-cell">C2</div><div class="grid-cell">C3</div><div class="grid-cell">C4</div>
            <div class="grid-cell">D1</div><div class="grid-cell">D2</div><div class="grid-cell">D3</div><div class="grid-cell">D4</div>
        </div>

        <div id="ui-bottom">
            <div id="age-text">AGE 0</div>
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
            <div id="item-bar">
                <div class="item-slot active">🔨</div>
                <div class="item-slot">🍎</div>
                <div class="item-slot">🍯</div>
                <div class="item-slot">🛡️</div>
                <div class="item-slot">🪵</div>
            </div>
        </div>
    </div>

    <!-- Oyun Mantığını Yükleyen Scriptler -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    <script src="client.js"></script>
    <script src="app.js"></script>
</body>
</html>
