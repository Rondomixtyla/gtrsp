<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sploop.io Survival Engine</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="status-panel">
            <div id="health-container">
                <div id="health-bar"></div>
                <span id="health-text">100 / 100</span>
            </div>
            <div id="resource-bar">
                <span>🪵 <b id="res-wood">0</b></span>
                <span>🪨 <b id="res-stone">0</b></span>
                <span>🪙 <b id="res-gold">0</b></span>
                <span>🍎 <b id="res-food">0</b></span>
            </div>
        </div>

        <div id="inventory-bar">
            <div class="slot active" data-slot="0"><span class="key">1</span>🔨</div>
            <div class="slot" data-slot="1"><span class="key">2</span>🪵</div>
            <div class="slot" data-slot="2"><span class="key">3</span>⚠️</div>
            <div class="slot" data-slot="3"><span class="key">4</span>🕳️</div>
            <div class="slot" data-slot="4"><span class="key">5</span>⚙️</div>
            <div class="slot" data-slot="5"><span class="key">6</span>🍎</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/input.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
