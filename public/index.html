<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sploop.io Ultimate Multiplayer</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #5c9432; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .menu-box {
            background: #2a3a1e; border: 4px solid #4a6b32; padding: 30px; border-radius: 12px;
            text-align: center; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px;
        }
        .menu-box h1 { margin: 0 0 20px 0; font-size: 28px; color: #a4de02; text-shadow: 2px 2px 0 #000; }
        .menu-box input {
            width: 100%; padding: 12px; border-radius: 6px; border: none; font-size: 16px;
            margin-bottom: 15px; text-align: center; font-weight: bold; outline: none;
        }
        .menu-box button {
            width: 100%; padding: 12px; border-radius: 6px; border: none; background: #8bc34a;
            color: white; font-weight: bold; font-size: 18px; cursor: pointer; text-shadow: 1px 1px 0 #000;
        }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: none; }

        #resource-bar {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6);
            padding: 8px 14px; border-radius: 8px; color: white; font-weight: bold; font-size: 14px;
            display: flex; gap: 15px; border: 2px solid rgba(255,255,255,0.2);
        }

        #leaderboard {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white;
            padding: 12px; border-radius: 8px; font-size: 13px; min-width: 190px; border: 2px solid rgba(255,255,255,0.2);
        }
        #leaderboard h3 { margin: 0 0 8px 0; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; color: #ffca28; }
        .lb-row { display: flex; justify-content: space-between; margin-bottom: 4px; gap: 10px; }
        .lb-row.me { color: #8bc34a; font-weight: bold; }

        #ui-bottom {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        #health-container {
            width: 220px; height: 16px; background: rgba(0,0,0,0.6); border-radius: 8px;
            overflow: hidden; border: 2px solid rgba(0,0,0,0.3); position: relative;
        }
        #health-bar { width: 100%; height: 100%; background: #4caf50; transition: width 0.1s; }
        #health-text { position: absolute; width: 100%; text-align: center; font-size: 10px; color: white; font-weight: bold; top: 1px; }

        #item-bar { display: flex; gap: 8px; pointer-events: auto; }
        .slot {
            width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 3px solid rgba(255,255,255,0.2);
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;
        }
        .slot.active { border-color: #ffca28; background: rgba(255,255,255,0.3); }

        #minimap-container {
            position: absolute; bottom: 15px; left: 15px; width: 100px; height: 100px;
            background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); border-radius: 6px;
        }
        #minimap-grid {
            width: 100%; height: 100%; display: grid;
            grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
        }
        .grid-cell { border: 1px solid rgba(255,255,255,0.05); font-size: 8px; color: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
        #player-dot {
            position: absolute; width: 8px; height: 8px; background: #ff3333;
            border-radius: 50%; border: 1px solid white; transform: translate(-50%, -50%); pointer-events: none;
        }

        .joystick-zone {
            position: absolute; bottom: 20px; width: 110px; height: 110px;
            border-radius: 50%; pointer-events: auto; touch-action: none;
            background: rgba(255, 255, 255, 0.08); border: 2px dashed rgba(255, 255, 255, 0.2);
        }
        #left-joystick-zone { left: 20px; }
        #right-joystick-zone { right: 20px; }
        .joystick-knob { width: 40px; height: 40px; border-radius: 50%; position: absolute; top: 35px; left: 35px; pointer-events: none; }
        #left-knob { background: rgba(255,255,255,0.4); }
        #right-knob { background: rgba(255, 87, 34, 0.6); }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-box">
            <h1>SPLOOP.IO</h1>
            <input type="text" id="nickname" placeholder="Oyuncu Adı" value="Savaşçı" maxlength="12">
            <button onclick="startGame()">OYNA</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="resource-bar">
            <span>🪵 <span id="res-wood">100</span></span>
            <span>🪨 <span id="res-stone">50</span></span>
            <span>🪙 <span id="res-gold">0</span></span>
        </div>

        <div id="leaderboard">
            <h3>Sıralama</h3>
            <div id="lb-list"></div>
        </div>

        <div id="minimap-container">
            <div id="minimap-grid">
                <div class="grid-cell">A1</div><div class="grid-cell">A2</div><div class="grid-cell">A3</div><div class="grid-cell">A4</div>
                <div class="grid-cell">B1</div><div class="grid-cell">B2</div><div class="grid-cell">B3</div><div class="grid-cell">B4</div>
                <div class="grid-cell">C1</div><div class="grid-cell">C2</div><div class="grid-cell">C3</div><div class="grid-cell">C4</div>
                <div class="grid-cell">D1</div><div class="grid-cell">D2</div><div class="grid-cell">D3</div><div class="grid-cell">D4</div>
            </div>
            <div id="player-dot"></div>
        </div>

        <div id="left-joystick-zone" class="joystick-zone"><div id="left-knob" class="joystick-knob"></div></div>
        <div id="right-joystick-zone" class="joystick-zone"><div id="right-knob" class="joystick-knob"></div></div>

        <div id="ui-bottom">
            <div id="health-container">
                <div id="health-bar"></div>
                <div id="health-text">100 / 100</div>
            </div>
            <div id="item-bar">
                <div class="slot active" onclick="selectSlot(0)" title="Çekiç">🔨</div>
                <div class="slot" onclick="selectSlot(1)" title="Duvar">🪵</div>
                <div class="slot" onclick="selectSlot(2)" title="Spike (Diken)">⚠️</div>
                <div class="slot" onclick="selectSlot(3)" title="Trap (Kapan)">🕳️</div>
                <div class="slot" onclick="selectSlot(4)" title="Windmill (Değirmen)">⚙️</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        let gameStarted = false;
        let players = {};
        let structures = [];
        let resources = [];
        let selectedSlot = 0; // 0: Çekiç, 1: Wall, 2: Spike, 3: Trap, 4: Windmill

        const player = {
            x: 2000, y: 2000, radius: 25, angle: 0, speed: 4, name: "Savaşçı", score: 0,
            gold: 0, health: 100, maxHealth: 100, wood: 100, stone: 50, attacking: false, attackAnim: 0
        };

        const mapSize = 4000;

        socket.on('initGame', (data) => {
            players = data.players;
            structures = data.structures;
            resources = data.resources;
            if(players[socket.id]) {
                player.x = players[socket.id].x;
                player.y = players[socket.id].y;
            }
        });

        socket.on('updatePlayers', (serverPlayers) => {
            players = serverPlayers;
            if(players[socket.id]) {
                player.wood = players[socket.id].wood;
                player.stone = players[socket.id].stone;
                player.gold = players[socket.id].gold;
                player.score = players[socket.id].score;
                player.health = players[socket.id].health;
                
                document.getElementById('res-wood').innerText = player.wood;
                document.getElementById('res-stone').innerText = player.stone;
                document.getElementById('res-gold').innerText = player.gold;
                
                let hpPercent = Math.max(0, (player.health / player.maxHealth) * 100);
                document.getElementById('health-bar').style.width = hpPercent + '%';
                document.getElementById('health-text').innerText = `${player.health} / ${player.maxHealth}`;
            }
        });

        socket.on('updateResources', (resList) => resources = resList);
        socket.on('structurePlaced', (st) => structures.push(st));
        socket.on('newPlayer', (p) => players[p.id] = p);
        socket.on('removePlayer', (id) => delete players[id]);

        function startGame() {
            const nick = document.getElementById('nickname').value.trim();
            if(nick) player.name = nick;
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            gameStarted = true;
            requestAnimationFrame(gameLoop);
        }

        const keys = {};
        let mouseX = canvas.width / 2, mouseY = canvas.height / 2;

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            player.angle = Math.atan2(mouseY - canvas.height/2, mouseX - canvas.width/2);
        });
        window.addEventListener('mousedown', () => doAction());

        const leftZone = document.getElementById('left-joystick-zone');
        const leftKnob = document.getElementById('left-knob');
        let moveX = 0, moveY = 0;

        setupJoystick(leftZone, leftKnob, (dx, dy) => { moveX = dx; moveY = dy; });

        const rightZone = document.getElementById('right-joystick-zone');
        const rightKnob = document.getElementById('right-knob');

        setupJoystick(rightZone, rightKnob, (dx, dy, active) => {
            if(active && (dx !== 0 || dy !== 0)) {
                player.angle = Math.atan2(dy, dx);
                doAction();
            }
        });

        function setupJoystick(zone, knob, callback) {
            let activeTouchId = null;
            zone.addEventListener('touchstart', handleTouch);
            zone.addEventListener('touchmove', handleTouch);
            zone.addEventListener('touchend', reset);
            zone.addEventListener('touchcancel', reset);

            function handleTouch(e) {
                e.preventDefault();
                const rect = zone.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let touch = e.touches[0];
                if(activeTouchId !== null) {
                    for(let t of e.touches) { if(t.identifier === activeTouchId) { touch = t; break; } }
                } else { activeTouchId = touch.identifier; }

                let dx = touch.clientX - cx, dy = touch.clientY - cy;
                const dist = Math.hypot(dx, dy), maxR = 35;
                if(dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                callback(dx / maxR, dy / maxR, true);
            }

            function reset(e) {
                knob.style.transform = `translate(0px, 0px)`;
                activeTouchId = null;
                callback(0, 0, false);
            }
        }

        function doAction() {
            if(!gameStarted) return;

            // Yapı Kurma
            if(selectedSlot > 0) {
                let types = ['', 'wall', 'spike', 'trap', 'windmill'];
                let tName = types[selectedSlot];
                const placeX = player.x + Math.cos(player.angle) * 60;
                const placeY = player.y + Math.sin(player.angle) * 60;
                socket.emit('placeStructure', { x: placeX, y: placeY, type: tName });
                return;
            }

            // Vurma / Toplama
            if(player.attacking) return;
            player.attacking = true;
            player.attackAnim = 0;
            socket.emit('hitAction');
        }

        function selectSlot(idx) {
            selectedSlot = idx;
            const slots = document.querySelectorAll('.slot');
            slots.forEach((s, i) => s.classList.toggle('active', i === idx));
        }

        function updateLeaderboard() {
            const list = Object.values(players);
            list.sort((a,b) => b.score - a.score);

            const lbContainer = document.getElementById('lb-list');
            lbContainer.innerHTML = '';
            list.slice(0, 5).forEach((p, index) => {
                const isMe = p.id === socket.id;
                const row = document.createElement('div');
                row.className = `lb-row ${isMe ? 'me' : ''}`;
                row.innerHTML = `<span>${index+1}. ${p.name}</span><span>${p.score}</span>`;
                lbContainer.appendChild(row);
            });
        }

        function updateMinimap() {
            const dot = document.getElementById('player-dot');
            dot.style.left = `${Math.min(100, Math.max(0, (player.x / mapSize) * 100))}%`;
            dot.style.top = `${Math.min(100, Math.max(0, (player.y / mapSize) * 100))}%`;
        }

        function drawCharacter(p, isMe) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);

            let weaponAngle = p.attacking ? Math.sin(Date.now() / 40) * 0.9 : 0;

            ctx.save();
            ctx.translate(20, 15);
            ctx.rotate(weaponAngle);
            ctx.fillStyle = '#795548'; ctx.fillRect(0, -4, 30, 8);
            ctx.fillStyle = '#607d8b'; ctx.fillRect(20, -12, 15, 24);
            ctx.restore();

            ctx.fillStyle = '#e0ac69';
            ctx.beginPath(); ctx.arc(20, 15, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(20, -15, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = isMe ? '#e0ac69' : '#d9822b'; ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#263238'; ctx.stroke();

            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(10, -7, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, 7, 4, 0, Math.PI*2); ctx.fill();

            ctx.restore();

            ctx.font = 'bold 13px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
            ctx.fillText(p.name || "Oyuncu", p.x, p.y - 35);
        }

        function gameLoop() {
            if(!gameStarted) return;

            let dx = 0, dy = 0;
            if(keys['w'] || keys['arrowup']) dy -= 1;
            if(keys['s'] || keys['arrowdown']) dy += 1;
            if(keys['a'] || keys['arrowleft']) dx -= 1;
            if(keys['d'] || keys['arrowright']) dx += 1;

            if(moveX !== 0 || moveY !== 0) { dx = moveX; dy = moveY; }

            if(dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                player.x = Math.max(50, Math.min(mapSize - 50, player.x + (dx / len) * player.speed));
                player.y = Math.max(50, Math.min(mapSize - 50, player.y + (dy / len) * player.speed));
            }

            socket.emit('playerUpdate', {
                x: player.x, y: player.y, angle: player.angle,
                name: player.name, attacking: player.attacking
            });

            updateMinimap();
            updateLeaderboard();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width/2 - player.x, canvas.height/2 - player.y);

            // Grid
            ctx.strokeStyle = '#52852c'; ctx.lineWidth = 4;
            const gridSize = 80;
            const startX = Math.floor((player.x - canvas.width) / gridSize) * gridSize;
            const endX = Math.floor((player.x + canvas.width) / gridSize) * gridSize;
            const startY = Math.floor((player.y - canvas.height) / gridSize) * gridSize;
            const endY = Math.floor((player.y + canvas.height) / gridSize) * gridSize;

            for(let x = startX; x < endX; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke(); }
            for(let y = startY; y < endY; y += gridSize) { ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke(); }

            // Yapılar (Wall, Spike, Trap, Windmill)
            structures.forEach(st => {
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.radius, 0, Math.PI * 2);
                if(st.type === 'wall') { ctx.fillStyle = '#a17a4a'; ctx.strokeStyle = '#5c4018'; }
                else if(st.type === 'spike') { ctx.fillStyle = '#b0bec5'; ctx.strokeStyle = '#37474f'; }
                else if(st.type === 'trap') { ctx.fillStyle = '#37474f'; ctx.strokeStyle = '#212121'; }
                else if(st.type === 'windmill') { ctx.fillStyle = '#ffb74d'; ctx.strokeStyle = '#e65100'; }
                ctx.fill(); ctx.lineWidth = 5; ctx.stroke();
            });

            // Kaynaklar (Ağaç / Taş)
            resources.forEach(res => {
                ctx.beginPath();
                ctx.arc(res.x, res.y, res.radius, 0, Math.PI * 2);
                if(res.type === 'tree') {
                    ctx.fillStyle = '#2e7d32'; ctx.fill();
                    ctx.lineWidth = 6; ctx.strokeStyle = '#1b5e20'; ctx.stroke();
                } else {
                    ctx.fillStyle = '#757575'; ctx.fill();
                    ctx.lineWidth = 6; ctx.strokeStyle = '#424242'; ctx.stroke();
                }
            });

            // Diğer Oyuncular
            for (let id in players) {
                if (id !== socket.id) drawCharacter(players[id], false);
            }

            // Kendimiz
            drawCharacter(player, true);

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
