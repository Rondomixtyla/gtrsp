<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gtrsp.io</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #78b546; font-family: sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .hidden { display: none !important; }
        
        /* Giriş Menüsü */
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .menu-box { background: #fff; padding: 25px; border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .menu-box h1 { margin-top: 0; color: #333; font-size: 28px; }
        .menu-box input { width: 90%; padding: 10px; margin: 10px 0; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; text-align: center; }
        
        /* Renk Seçimi */
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .color-option { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s; }
        .color-option.selected { border-color: #000; transform: scale(1.15); }

        .btn { background: #4caf50; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn:hover { background: #43a047; }

        /* Oyun İçi Arayüz */
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .interactive { pointer-events: auto; }
        
        .top-left-btns { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; }
        .ui-btn { background: rgba(0,0,0,0.5); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        /* Sağ Üst Chat Kutusu (Anlık Yazı Akışı) */
        #chat-container { position: absolute; top: 15px; right: 220px; width: 250px; }
        #chat-input { width: 100%; background: rgba(0,0,0,0.3); border: none; border-radius: 6px; padding: 8px; color: white; font-size: 14px; outline: none; }
        #chat-input::placeholder { color: #ddd; }

        /* Sağ Alt Envanter */
        #inventory { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; }
        .slot { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid transparent; }
        .slot.active { border-color: #ffd700; background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div id="start-menu">
        <div class="menu-box">
            <h1>gtrsp.io</h1>
            <input type="text" id="nickname-input" placeholder="Karakter Adı" maxlength="12">
            
            <div style="font-size: 14px; font-weight: bold; color: #555; margin-top: 10px;">Karakter Rengi Seç</div>
            <div class="color-picker">
                <div class="color-option selected" style="background: #fbc093;" data-color="#fbc093"></div>
                <div class="color-option" style="background: #e74c3c;" data-color="#e74c3c"></div>
                <div class="color-option" style="background: #3498db;" data-color="#3498db"></div>
                <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                <div class="color-option" style="background: #f1c40f;" data-color="#f1c40f"></div>
            </div>

            <button class="btn" id="play-btn">OYUNA BAŞLA</button>
        </div>
    </div>

    <div id="ui-container" class="hidden">
        <div class="top-left-btns interactive">
            <button class="ui-btn" onclick="toggleModal('shop-modal')">Market</button>
            <button class="ui-btn" onclick="toggleModal('clan-modal')">Klan</button>
        </div>

        <div id="chat-container" class="interactive">
            <input type="text" id="chat-input" placeholder="Bir şeyler yaz..." maxlength="60">
        </div>

        <div id="inventory" class="interactive">
            <div class="slot active" onclick="selectSlot(0)">⚔️</div>
            <div class="slot" onclick="selectSlot(1)">🍎</div>
            <div class="slot" onclick="selectSlot(2)">🪵</div>
            <div class="slot" onclick="selectSlot(3)">🛡️</div>
            <div class="slot" onclick="selectSlot(4)">🌀</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/client.js"></script>
</body>
</html>
