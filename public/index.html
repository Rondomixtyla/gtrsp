<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sploop.io</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- OYUNA GİRİŞ EKRANI (START MENU) -->
    <div id="start-menu">
        <div class="menu-box">
            <h1>Sploop.io</h1>
            <input type="text" id="nickname-input" placeholder="Enter Nickname..." maxlength="15">
            <button id="play-btn">PLAY</button>
        </div>
    </div>

    <!-- OYUN İÇİ ARAYÜZ (HUD) -->
    <div id="ui-container" class="hidden">
        <!-- Sağ Üst Leaderboard (Skor Tablosu) -->
        <div id="leaderboard">
            <h3>LEADERBOARD</h3>
            <ol id="leaderboard-list"></ol>
        </div>

        <!-- Sol Alttaki Mini Harita (A1 - D4) -->
        <div id="minimap-grid">
            <div class="row"><span>A1</span><span>A2</span><span>A3</span><span>A4</span></div>
            <div class="row"><span>B1</span><span>B2</span><span>B3</span><span>B4</span></div>
            <div class="row"><span>C1</span><span>C2</span><span>C3</span><span>C4</span></div>
            <div class="row"><span>D1</span><span>D2</span><span>D3</span><span>D4</span></div>
            <div id="minimap-player"></div>
        </div>

        <!-- Alt Ortadaki Envanter ve Yaş Barı -->
        <div id="bottom-hud">
            <div id="age-label">AGE <span id="age-num">0</span></div>
            <div id="xp-bar-bg"><div id="xp-bar-fill"></div></div>
            <div id="inventory-bar">
                <div class="slot active" data-slot="0">🔨</div>
                <div class="slot" data-slot="1">🍎</div>
                <div class="slot" data-slot="2">🪵</div>
                <div class="slot" data-slot="3">🕳️</div>
                <div class="slot" data-slot="4">⚠️</div>
                <div class="slot" data-slot="5">⚙️</div>
            </div>
        </div>

        <!-- Sağ Alttaki Kaynak Göstergeleri -->
        <div id="resource-panel">
            <div class="res-item">🍎 <span id="res-food">100</span></div>
            <div class="res-item">🪵 <span id="res-wood">100</span></div>
            <div class="res-item">🪨 <span id="res-stone">100</span></div>
            <div class="res-item">🪙 <span id="res-gold">0</span></div>
        </div>

        <!-- Dokunmatik Kontrol Alanı (Sol Taraf) -->
        <div id="joystick-zone"></div>
        <!-- Vurma Butonu (Sağ Taraf) -->
        <div id="action-btn">⚔️</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/input.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
